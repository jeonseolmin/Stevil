spring:
  application:
    name: stevil-backend

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jwt:
    secret: mySuperSecretKeyForStevilProjectWhichIsVeryLongAndSecure12345!
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash


# =========================================================
# Planner
# =========================================================

planner:
  generator-url: ${PLANNER_GENERATOR_URL:http://127.0.0.1:8091/api/plan}


# =========================================================
# Naver API
# =========================================================

naver:
  search:
    client-id: ${NAVER_API_HUB_CLIENT_ID}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET}
    base-url: https://naverapihub.apigw.ntruss.com


# =========================================================
# Food API
# =========================================================

food:
  api:
    key: ${FOOD_API_KEY:}
    url: https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo02/getFoodNtrCpntDbInq02


# =========================================================
# Server
# =========================================================

server:
  port: ${SERVER_PORT:8080}


# =========================================================
# Application
# =========================================================

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}