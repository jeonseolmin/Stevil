spring:
  application:
    name: stevil-backend

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  jwt:
    secret: mySuperSecretKeyForStevilProjectWhichIsVeryLongAndSecure12345!
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash

  # 💡 security 블록을 spring 안쪽으로 2칸 들여쓰기하여 이동했습니다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 7a005d19b9513cad42a77955202e550d
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
              - talk_message
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

naver:
  search:
    client-id: ${NAVER_API_HUB_CLIENT_ID:}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}
    base-url: https://naverapihub.apigw.ntruss.com

food:
  api:
    key: "9deb2f7d4304fe4a23865fb2c185c97355831fd327796c9f656b362ebb3458b0"
    url: "https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo02/getFoodNtrCpntDbInq02"

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}