spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/${DB_NAME:stevil_db}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jwt:
    secret: ${JWT_SECRET}

  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  ai:
    google:
      gemini:
        api-key: ${GEMINI_API_KEY:}

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:local-unconfigured}
            client-secret: ${NAVER_CLIENT_SECRET:local-unconfigured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

          google:
            client-id: ${GOOGLE_CLIENT_ID:local-unconfigured}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-unconfigured}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-unconfigured}
            client-secret: ${KAKAO_CLIENT_SECRET:local-unconfigured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
server:
  address: 127.0.0.1

planner:
  generator-url: ${PLANNER_GENERATOR_URL:http://127.0.0.1:8091/api/plan}

naver:
  search:
    client-id: ${NAVER_API_HUB_CLIENT_ID:}
    client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}
