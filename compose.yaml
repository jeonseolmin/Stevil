services:
  postgres:
    image: postgres:17-alpine
    container_name: stevil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      # host-only: DB access from outside goes through an SSH tunnel
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: stevil-backend
    container_name: stevil-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_URL: ${FRONTEND_URL:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?required}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?required}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?required}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?required}
      NAVER_API_HUB_CLIENT_ID: ${NAVER_API_HUB_CLIENT_ID:-}
      NAVER_API_HUB_CLIENT_SECRET: ${NAVER_API_HUB_CLIENT_SECRET:-}
      MAIL_USERNAME: ${MAIL_USERNAME:?required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      PLANNER_GENERATOR_URL: ${PLANNER_GENERATOR_URL:-http://rag-api:8091/api/plan}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STEVIL_FIREBASE_ENABLED: ${STEVIL_FIREBASE_ENABLED:-false}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
      STEVIL_REMINDER_SCHEDULER_ENABLED: ${STEVIL_REMINDER_SCHEDULER_ENABLED:-false}
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # host-only: public traffic reaches the backend through nginx (backend:8080 on the compose network)
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./stevil-frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_NAVER_MAP_CLIENT_ID: ${VITE_NAVER_MAP_CLIENT_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    container_name: stevil-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

# FCM service-account key, mounted read-only at /run/secrets/firebase-service-account.json.
# The real key lives outside the repo (e.g. /etc/stevil/firebase-service-account.json, root:root 600); set
# FIREBASE_SERVICE_ACCOUNT_FILE in the server .env to that path. The default is an empty tracked placeholder
# so `docker compose` works on any OS without a key (FCM then stays off / falls back to NoopPushSender).
secrets:
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:-./deploy/firebase-credentials.placeholder}

volumes:
  postgres-data: