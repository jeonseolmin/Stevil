limit_req_zone $binary_remote_addr zone=rag_requests:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=diet_requests:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (webroot mounted from the host)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Fixed hostname: an IP-based request must not be sent to https://<ip> (cert mismatch)
    location / {
        return 301 https://stevil-health.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/stevil-health.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stevil-health.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 110s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws-stomp {
        proxy_pass http://backend:8080/ws-stomp;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authenticated RAG proxy (Wegovy - 8091)
    location = /_rag_auth {
        internal;
        proxy_pass http://backend:8080/api/users/me;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin "";
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 =401 /_rag_unauthorized;
    }
    location = /_rag_unauthorized {
        internal;
        return 401;
    }
    location /rag-api/ {
        auth_request /_rag_auth;
        limit_req zone=rag_requests burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://rag-api:8091/api/;
        proxy_read_timeout 110s;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    # Authenticated Diet AI proxy (Diet Coach - 8092)
    location = /_diet_auth {
        internal;
        proxy_pass http://backend:8080/api/users/me;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin "";
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 =401 /_diet_unauthorized;
    }
    location = /_diet_unauthorized {
        internal;
        return 401;
    }
    location /diet-api/ {
        auth_request /_diet_auth;
        limit_req zone=diet_requests burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://host.docker.internal:8092/api/;
        proxy_read_timeout 110s;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    # Push service worker must not be cached, so updates reach browsers immediately
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
