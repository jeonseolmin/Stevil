services:
  rag-api:
    image: stevil-rag-api:local
    build:
      context: ..
      dockerfile: rag/Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?required}
      GEMINI_MODEL: ${GEMINI_MODEL:?required}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:?required}
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 384m
    networks:
      - stevil
networks:
  stevil:
    external: true
    name: stevil_default
